name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username broker --dbname broker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://broker:broker-test-password@127.0.0.1:5432/broker_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.12
          cache: true
      - name: Verify modules and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Enforce coverage
        run: |
          go tool cover -func=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="${coverage}" 'BEGIN {if (coverage + 0 < 80) exit 1}'
      - name: Enforce core package coverage
        run: |
          check_coverage() {
            package="$1"
            minimum="$2"
            profile="/tmp/$(basename "${package}")-coverage.out"
            go test -count=1 -coverprofile="${profile}" "${package}"
            coverage="$(go tool cover -func="${profile}" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
            awk -v coverage="${coverage}" -v minimum="${minimum}" \
              'BEGIN {if (coverage + 0 < minimum + 0) exit 1}'
          }
          check_coverage ./internal/auth 95
          check_coverage ./internal/attachments 95
          check_coverage ./internal/approvals 80
      - name: Build static binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/server ./cmd/server
          CGO_ENABLED=0 go build -trimpath -o /tmp/migrate ./cmd/migrate

  skill:
    name: Skill client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: python -m pip install "pytest==8.3.4" "pytest-cov==5.0.0"
      - name: Test client
        run: |
          python -m pytest -q \
            skills/dingtalk-oa-attachment/tests/test_client.py \
            --cov=dingtalk_oa_attachment_client \
            --cov-report=term-missing \
            --cov-fail-under=80
          python -m py_compile \
            skills/dingtalk-oa-attachment/scripts/dingtalk_oa_attachment.py

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Lint Markdown and OpenAPI
        run: |
          npx --yes markdownlint-cli2@0.23.0 \
            README.md SECURITY.md CONTRIBUTING.md \
            'docs/*.md' \
            skills/dingtalk-oa-attachment/SKILL.md \
            'skills/dingtalk-oa-attachment/references/*.md'
          npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml

  container:
    name: Container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --pull --tag dingtalk-oa-attachment-broker:test .
      - name: Verify runtime user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' dingtalk-oa-attachment-broker:test)"
          test "${user}" = "65532:65532"
      - name: Verify multi-platform image
        run: |
          docker buildx create --driver docker-container --name broker-ci --use
          docker buildx build \
            --pull \
            --platform linux/amd64,linux/arm64 \
            --output type=oci,dest=/tmp/broker-image.tar \
            .

  publish:
    name: Publish image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - go
      - skill
      - docs
      - container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
      - name: Build and push image
        env:
          IMAGE: ghcr.io/cdryzun/dingtalk-oa-attachment-broker
        run: |
          docker buildx create --driver docker-container --name broker-publish --use
          docker buildx build \
            --pull \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --provenance=mode=max \
            --sbom=true \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            --push \
            .
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
